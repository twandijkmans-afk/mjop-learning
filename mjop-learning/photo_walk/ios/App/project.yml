# XcodeGen-specificatie (brew install xcodegen; xcodegen generate). Er wordt bewust geen .xcodeproj gecommit.
# STATUS: niet gegenereerd en niet gecompileerd in de ontwikkelomgeving (geen macOS/Xcode).
name: PhotoWalk
options:
  bundleIdPrefix: nl.mjop.photowalk
  deploymentTarget:
    iOS: "16.0"
packages:
  PhotoWalkCore:
    path: ..
targets:
  PhotoWalk:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared                      # samenvatting voor de widget (ook in MJOPWidget)
      - path: ../Tests/PhotoWalkCoreTests/Fixtures/parity_cases.json   # alleen voor de simulatiemodus (synthetische data)
        buildPhase: resources
    dependencies:
      - package: PhotoWalkCore
        product: PhotoWalkCore
      - package: PhotoWalkCore
        product: MJOPIntegration
      - package: PhotoWalkCore
        product: Gevelscan            # Gevelscanner 2.0: pijplijn en contract (docs/gevelscanner_2.md)
      - package: PhotoWalkCore
        product: MJOPEngine           # MJOP Live 3: rekenmodel en het lezen van BAG/3D BAG
      - target: MJOPWidget            # widget op het beginscherm (ingebed)
    entitlements:
      path: PhotoWalk.generated.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.mjop.photowalk]
    info:
      path: Info.generated.plist          # door XcodeGen gegenereerd; niet committen
      properties:
        CFBundleDisplayName: MJOP Live
        NSCameraUsageDescription: "Met de camera maak je foto's van de gevels en papieren documenten. Een gevelfoto gaat alleen naar Claude voor de herkenning als je daarvoor kiest."
        NSFaceIDUsageDescription: "Met Face ID open je MJOP Live zonder je wachtwoord in te typen. Je gezicht blijft op deze iPhone."
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        CFBundleURLTypes:                   # mjoplive://auth-callback?code=... (terugkeer uit de browser na een Supabase-magic-link)
          - CFBundleURLName: nl.mjop.photowalk.auth
            CFBundleURLSchemes: [mjoplive]
        UIFileSharingEnabled: true          # exportbestanden zichtbaar in de Bestanden-app (handig zonder Mac)
        LSSupportsOpeningDocumentsInPlace: true
        # Bewust GEEN NSLocationWhenInUseUsageDescription: er worden geen locatiegegevens bewaard.
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: nl.mjop.photowalk.prototype
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon   # app-icoon: kobaltblauw met witte M (Sources/Assets.xcassets)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.0"          # app-versie 2 = native tabs (User-Agent MJOPLiveApp/2)
        CURRENT_PROJECT_VERSION: "2"
      configs:
        # Echte build-time afscherming van de ontwikkelinterface (meetdiagnose, ontwikkelbundel): alleen Debug definieert DEBUG. CI controleert dit.
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: RELEASE
  MJOPWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: MJOPWidget-Info.generated.plist
      properties:
        CFBundleDisplayName: MJOP Live
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: MJOPWidget.generated.entitlements
      properties:
        com.apple.security.application-groups: [group.nl.mjop.photowalk]
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: nl.mjop.photowalk.prototype.widget
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "2"
  PhotoWalkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PhotoWalk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.mjop.photowalk.uitests
        TEST_TARGET_NAME: PhotoWalk
schemes:
  PhotoWalk:
    build:
      targets:
        PhotoWalk: all
    test:
      targets:
        - PhotoWalkUITests
