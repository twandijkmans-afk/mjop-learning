# Photo Walk iOS (mjop-learning/photo_walk/ios): echte Swift- en iOS-build op een macOS-runner.
#
# - Geen code signing, geen Apple-accountgegevens, geen secrets. Er wordt niets gepubliceerd of geupload buiten de GitHub-artifacts van deze run.
# - Alleen synthetische data. De simulator heeft geen ARKit-camera: de smoketest draait de app headless met `-selftest` (synthetische simulatie).
# - De "unsigned device build" hieronder is NIET direct op een iPhone te installeren; zie photo_walk/docs/install_windows_free.md.
# - De app is sinds de MJOP-integratie "MJOP Live" (Mijn MJOP in WebView + Gevelscanner); de target/artefactnamen (PhotoWalk) blijven gelijk.
name: Photo walk iOS build

on:
  pull_request:
    paths:
      - "mjop-learning/photo_walk/**"
      - ".github/workflows/photo-walk-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-walk-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mjop-learning/photo_walk/ios
    env:
      LOGS: ${{ github.workspace }}/ci-logs
    steps:
      - uses: actions/checkout@v4

      - name: Runner, Xcode en SDK's controleren
        run: |
          mkdir -p "$LOGS"
          sw_vers
          echo "--- beschikbare Xcode-versies"; ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::geen Xcode 16.x op deze runner"; exit 1; fi
          sudo xcode-select -s "$XC/Contents/Developer"
          echo "Gekozen Xcode: $XC"
          xcodebuild -version | tee "$LOGS/xcodebuild-version.txt"
          swift --version | tee "$LOGS/swift-version.txt"
          echo "--- SDK's"; xcodebuild -showsdks | tee "$LOGS/sdks.txt"
          echo "--- simulator-runtimes"; xcrun simctl list runtimes | tee "$LOGS/runtimes.txt"
          grep -q "iphoneos" "$LOGS/sdks.txt" || { echo "::error::geen iPhoneOS-SDK"; exit 1; }
          grep -q "iphonesimulator" "$LOGS/sdks.txt" || { echo "::error::geen iPhoneSimulator-SDK"; exit 1; }
          {
            echo "### Toolchain"
            echo '```'; sw_vers; xcodebuild -version; swift --version; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Swift-package bouwen (PhotoWalkCore)
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$LOGS/swift-build.log"

      - name: Swift-unit- en pariteitstests
        run: |
          set -o pipefail
          swift test 2>&1 | tee "$LOGS/swift-test.log"

      - name: XcodeGen installeren en project genereren
        run: |
          set -o pipefail
          brew install xcodegen 2>&1 | tail -3
          xcodegen --version
          cd App && xcodegen generate --spec project.yml 2>&1 | tee "$LOGS/xcodegen.log"
          ls -la PhotoWalk.xcodeproj

      - name: App bouwen voor de iOS-simulator (zonder code signing)
        run: |
          set -o pipefail
          cd App
          xcodebuild -project PhotoWalk.xcodeproj -scheme PhotoWalk -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-sim" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$LOGS/xcodebuild-sim.log"

      - name: App bouwen voor een fysiek toestel (UNSIGNED, niet installeerbaar)
        run: |
          set -o pipefail
          cd App
          xcodebuild -project PhotoWalk.xcodeproj -scheme PhotoWalk -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-dev" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$LOGS/xcodebuild-device.log"

      - name: Waarschuwingen en fouten samenvatten
        if: always()
        run: |
          {
            echo "### Compiler-uitvoer"
            for f in swift-build swift-test xcodebuild-sim xcodebuild-device xcodebuild-uitest; do
              [ -f "$LOGS/$f.log" ] || continue
              e=$(grep -c "error:" "$LOGS/$f.log" || true); w=$(grep -c "warning:" "$LOGS/$f.log" || true)
              echo "- **$f**: $e fouten, $w waarschuwingen"
            done
            echo; echo "#### Fouten"; echo '```'; grep -h "error:" "$LOGS"/*.log | sort -u | head -40 || true; echo '```'
            echo "#### Unieke waarschuwingen (eerste 40)"; echo '```'; grep -h "warning:" "$LOGS"/*.log | sort -u | head -40 || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -h "error:" "$LOGS"/*.log | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done || true

      - name: Controles op de gebouwde app (permissies, capabilities, geen netwerkcode)
        run: |
          APP=$(find "$RUNNER_TEMP/dd-sim" -name PhotoWalk.app -type d | head -1)
          [ -n "$APP" ] || { echo "::error::PhotoWalk.app (simulator) niet gevonden"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          plutil -p "$APP/Info.plist" | tee "$LOGS/Info.plist.txt"
          grep -q "NSCameraUsageDescription" "$LOGS/Info.plist.txt" || { echo "::error::NSCameraUsageDescription ontbreekt"; exit 1; }
          grep -q "arkit" "$LOGS/Info.plist.txt" || { echo "::error::UIRequiredDeviceCapabilities arkit ontbreekt"; exit 1; }
          if grep -q "NSLocation" "$LOGS/Info.plist.txt"; then echo "::error::locatiepermissie aanwezig; niet toegestaan"; exit 1; fi
          # De scanner (PhotoWalkCore + scannercode) bevat geen netwerk- of WebKit-code; die staat uitsluitend in App/Sources/MJOP.
          if grep -rEn "URLSession|NWConnection|CFNetwork|WKWebView|import Network|import WebKit|URLRequest" Sources/PhotoWalkCore App/Sources --exclude-dir=MJOP; then
            echo "::error::netwerkcode buiten App/Sources/MJOP gevonden"; exit 1; fi
          # de testbare integratiekern is platformonafhankelijk (alleen Foundation)
          if grep -rEn "import (WebKit|UIKit|ARKit|SwiftUI|Network)" Sources/MJOPIntegration Sources/Gevelscan; then
            echo "::error::MJOPIntegration en Gevelscan mogen alleen Foundation gebruiken"; exit 1; fi
          grep -q "mjoplive" "$LOGS/Info.plist.txt" || { echo "::error::URL-schema mjoplive ontbreekt in Info.plist"; exit 1; }
          grep -q "UIRequiredDeviceCapabilities" "$LOGS/Info.plist.txt" || { echo "::error::UIRequiredDeviceCapabilities ontbreekt"; exit 1; }
          ls -la "$APP/parity_cases.json"

      - name: Afscherming ontwikkelinterface - Release-binary bevat geen meetdiagnose/ontwikkelbundel (Debug wel)
        run: |
          set -o pipefail
          cd App
          # 1) build-time vlag per configuratie: alleen Debug definieert DEBUG
          for cfg in Debug Release; do
            xcodebuild -project PhotoWalk.xcodeproj -scheme PhotoWalk -configuration "$cfg" -sdk iphoneos -showBuildSettings 2>/dev/null \
              | grep "SWIFT_ACTIVE_COMPILATION_CONDITIONS" | sort -u | tee "$LOGS/compilation-conditions-$cfg.txt"
          done
          grep -q "DEBUG" "$LOGS/compilation-conditions-Debug.txt" || { echo "::error::Debug definieert DEBUG niet"; exit 1; }
          if grep -q "DEBUG" "$LOGS/compilation-conditions-Release.txt"; then echo "::error::Release definieert DEBUG"; exit 1; fi
          # 2) inhoud van de gebouwde apps: alle Mach-O-bestanden (executable + debug.dylib) op symbolen en strings
          scan() { find "$1" -type f | while IFS= read -r f; do if file "$f" | grep -q "Mach-O"; then nm -a "$f" 2>/dev/null; strings -a "$f"; fi; done; }
          DBG=$(find "$RUNNER_TEMP/dd-sim" -name PhotoWalk.app -type d | head -1)
          REL=$(find "$RUNNER_TEMP/dd-dev" -name PhotoWalk.app -type d | head -1)
          [ -n "$DBG" ] && [ -n "$REL" ] || { echo "::error::Debug- of Release-app niet gevonden"; exit 1; }
          scan "$DBG" > "$RUNNER_TEMP/scan-debug.txt"; scan "$REL" > "$RUNNER_TEMP/scan-release.txt"
          wc -l "$RUNNER_TEMP"/scan-*.txt
          # Release-binary: bevat de afgeschermde onderdelen niet. Debug-binary: bevat ze wel (positieve controle: de scan is dus niet blind).
          MARKERS="DevBundleStore DiagnosticsView DiagnosticsExport devBundleToggle exportDiagnosticsButton photowalk.devBundle meetdiagnose_ diagnosticsLink"
          for m in $MARKERS; do
            d=$(grep -c "$m" "$RUNNER_TEMP/scan-debug.txt" || true); r=$(grep -c "$m" "$RUNNER_TEMP/scan-release.txt" || true)
            echo "marker $m: debug=$d release=$r" | tee -a "$LOGS/release-scan.txt"
            [ "$d" -ge 1 ] || { echo "::error::positieve controle mislukt: '$m' niet in de Debug-binary; de scan is onbetrouwbaar"; exit 1; }
            [ "$r" -eq 0 ] || { echo "::error::'$m' gevonden in de Release-binary: ontwikkelinterface niet afgeschermd"; exit 1; }
          done
          # (Vervallen: de controle op MotionAdvice in Release. Dat was het bewegingsadvies van de camera-scanner; die scanner is uit de app gehaald
          # en vervangen door de gevelfoto, dus de linker laat deze code terecht weg. Informatief blijft hieronder zichtbaar of hij er nog in zit.)
          echo "info MotionAdvice: release=$(grep -c "MotionAdvice" "$RUNNER_TEMP/scan-release.txt" || true)" | tee -a "$LOGS/release-scan.txt"
          # Informatief: bibliotheekcode zonder aanroeper in de app (kan door de linker wel of niet worden meegenomen)
          for m in CaptureBundle ExtendedDiagnostics photo_walk_capture_bundle_v1; do
            echo "info $m: debug=$(grep -c "$m" "$RUNNER_TEMP/scan-debug.txt" || true) release=$(grep -c "$m" "$RUNNER_TEMP/scan-release.txt" || true)" | tee -a "$LOGS/release-scan.txt"
          done
          echo "Release-binary: ontwikkelinterface niet aanwezig"

      - name: Simulator-smoketest (headless selftest, export valideren)
        timeout-minutes: 15
        run: |
          set -o pipefail
          # simctl kan zonder foutmelding blijven hangen (CI-flake): elke aanroep krijgt een tijdslimiet (perl alarm, macOS heeft geen `timeout`)
          tmo() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(rt,x) for rt,l in d.items() if 'iOS' in rt for x in l if 'iPhone' in x['name']]
          c.sort(key=lambda t:t[0])
          print(c[-1][1]['udid'])")
          echo "Simulator: $UDID"
          tmo 60 xcrun simctl boot "$UDID" || true
          tmo 240 xcrun simctl bootstatus "$UDID" -b | tail -2 || true
          for i in 1 2 3; do
            tmo 120 xcrun simctl install "$UDID" "$APP" && break
            echo "simctl install poging $i mislukt of hing; simulator herstarten"
            tmo 60 xcrun simctl shutdown "$UDID" || true; tmo 60 xcrun simctl boot "$UDID" || true; tmo 240 xcrun simctl bootstatus "$UDID" -b | tail -1 || true
          done
          # De simulator start de app soms niet (CI-flake): tot 3 pogingen met opnieuw opstarten.
          for attempt in 1 2 3; do
            : > "$LOGS/selftest-console.log"
            tmo 30 xcrun simctl terminate "$UDID" nl.mjop.photowalk.prototype 2>/dev/null || true
            xcrun simctl launch --console-pty --terminate-running-process "$UDID" nl.mjop.photowalk.prototype -selftest > "$LOGS/selftest-console.log" 2>&1 &
            LPID=$!
            for i in $(seq 1 100); do grep -q "SELFTEST_DONE" "$LOGS/selftest-console.log" && break; sleep 1; done
            grep -q "SELFTEST_DONE" "$LOGS/selftest-console.log" && break
            echo "poging $attempt: geen selftest-uitvoer; simulator herstarten"
            kill $LPID 2>/dev/null || true
            tmo 60 xcrun simctl shutdown "$UDID" || true; tmo 60 xcrun simctl boot "$UDID" || true; tmo 240 xcrun simctl bootstatus "$UDID" -b | tail -1 || true
          done
          cat "$LOGS/selftest-console.log"
          if ! grep -q "SELFTEST_DONE" "$LOGS/selftest-console.log"; then
            echo "--- diagnose: crashrapporten"; ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | tee "$LOGS/crash-list.txt"
            for f in ~/Library/Logs/DiagnosticReports/PhotoWalk*; do [ -f "$f" ] && head -60 "$f" | tee -a "$LOGS/crash-report.txt"; done
            echo "--- diagnose: simulatorlog"; xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'process == "PhotoWalk"' 2>&1 | tail -120 | tee "$LOGS/sim-log.txt"
            echo "::error::selftest gaf geen export (app gecrasht of niet gestart)"; exit 1
          fi
          sleep 2; xcrun simctl io "$UDID" screenshot "$LOGS/launch.png"
          kill $LPID 2>/dev/null || true
          DATA=$(xcrun simctl get_app_container "$UDID" nl.mjop.photowalk.prototype data)
          EXP=$(ls "$DATA"/Documents/photo_walk_*.json | head -1)
          cp "$EXP" "$LOGS/selftest-export.json"
          cp "$DATA"/Documents/mjop_scan_proposal_selftest.json "$LOGS/selftest-proposal.json"
          cp "$DATA"/Documents/mjop_round_proposals_selftest.json "$LOGS/selftest-round-proposals.json"
          cp "$DATA"/Documents/mjop_gevel_inventory_selftest.json "$LOGS/selftest-gevel-inventory.json"
          cp "$DATA"/Documents/facade_selftest_export.json "$LOGS/selftest-facade-export.json"
          cp "$DATA"/Documents/legacy_selftest_export.json "$LOGS/selftest-legacy-export.json"
          cp "$DATA"/Documents/mjop_round_proposals_unconfirmed.json "$LOGS/selftest-round-unconfirmed.json"
          mkdir -p "$LOGS/diag"; cp "$DATA"/Documents/meetdiagnose_*.json "$LOGS/diag/"; ls -la "$LOGS/diag"
          # Ontwikkelbundel is standaard UIT: de selftest (Debug-build, schakelaar niet aangezet) schrijft er geen. $DATA moet echt een app-container zijn,
          # anders zou deze controle niets controleren.
          [ -n "$DATA" ] && [ -d "$DATA/Documents" ] || { echo "::error::app-container niet gevonden; bundel-controle niet mogelijk"; exit 1; }
          if find "$DATA/Library" "$DATA/Documents" -name 'bundle_*' -o -name 'devbundles' -o -name '*.f32' 2>/dev/null | grep -q .; then
            echo "::error::ontwikkelbundel aangemaakt zonder dat de schakelaar aan stond"; find "$DATA" -name 'bundle_*' -o -name 'devbundles' -o -name '*.f32'; exit 1; fi
          echo "ontwikkelbundel: niets geschreven door de selftest (schakelaar standaard uit)"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "export: $EXP"

      - name: UI-rooktest in de simulator (XCUITest; app zonder ARKit/sensoren mag niet crashen)
        timeout-minutes: 35
        run: |
          set -o pipefail
          cd App
          xcodebuild -project PhotoWalk.xcodeproj -scheme PhotoWalk -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd-ui" \
            -resultBundlePath "$LOGS/ui-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test 2>&1 | tee "$LOGS/xcodebuild-uitest.log"
          xcrun simctl io "$UDID" screenshot "$LOGS/after-uitest.png" || true
          xcrun simctl shutdown "$UDID" || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Export van de Swift-app valideren tegen het schema (Python)
        run: |
          python -m pip install -q -r ../python/requirements.txt
          cd ../python
          python -m photo_walk_core.validate "$LOGS/selftest-export.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["LOGS"] + "/selftest-export.json"))
          assert r["data_origin"] == "SIMULATION" and r["invariants"]["is_final"] is False
          assert r["capture_mode"] == "PHOTO" and r["detection_summary"]["validated_on_real_buildings"] is False
          import re
          objs = [o for o in r["objects"] if o["gross_area_m2"]]
          print("objecten:", len(r["objects"]), "met maat:", len(objs))
          roles = {o["observation_id"]: (o.get("facade_role") or {}) for o in r["observations"]}
          print("buitencontouren:", {k: v.get("outer_contour_status") for k, v in roles.items()})
          # gevelopbouw: een kozijn met maat heeft nooit een onbevestigde (automatisch herkende) buitencontour
          for o in objs:
              for ref in o["observation_refs"]:
                  assert roles[ref].get("outer_contour_status") not in ("DETECTED_ENCLOSING_PANES", "UNVERIFIED", "PROPOSED_EXPANSION", "EDITED_UNCONFIRMED"), (ref, roles[ref])
          # vóór bevestiging: geen enkel automatisch kozijn met maat (alleen indicatief in de app)
          assert not [o for o in objs if any(roles[ref].get("outer_contour_status") != "LEGACY" and roles[ref].get("outer_contour_status") not in ("MANUAL", "USER_CONFIRMED") for ref in o["observation_refs"])]
          # glasvlakken zijn nooit een kozijnobject
          frames = r["facade_composition"]["frames"]
          panes = [e for f in frames for e in f["elements"] if e["role"] == "GLASS_PANE"]
          pane_px = {tuple(map(tuple, e["polygon_px"])) for e in panes}
          for o in r["objects"]:
              for cp in o["corner_pixels"]:
                  assert tuple(map(tuple, cp["points"])) not in pane_px, "een glasvlak staat als kozijn in de export"
          print("glasvlakken (apart, geen kozijn):", len(panes))
          # buitenmaat van het synthetische kozijn: automatisch (export) of pas na de gesimuleerde bevestiging door de gebruiker
          log = open(os.environ["LOGS"] + "/selftest-console.log").read()
          cands = [("export", float(o["outer_width_m"]), float(o["outer_height_m"])) for o in objs]
          cands += [("na bevestiging", float(m.group(1)), float(m.group(2))) for m in re.finditer(r"SELFTEST_AFTER_CONFIRM \S+ contour=\S+ w=(\S+) h=(\S+)", log)]
          assert cands, "geen enkele buitenmaat, ook niet na bevestiging"
          best = min(cands, key=lambda c: abs(c[1] - 1.2) + abs(c[2] - 1.5))
          print("beste buitenmaat:", best)
          assert abs(best[1] - 1.2) < 0.08 and abs(best[2] - 1.5) < 0.08, "buitenmaat wijkt te veel af van de synthetische waarheid (glas i.p.v. buitenkozijn?)"
          assert all(o["dimension_status"] in ("ESTIMATED", "DERIVED", "UNKNOWN") for o in r["objects"]), "een enkele foto mag nooit MEASURED zijn"
          assert all("AUTO_DETECTED_UNCONFIRMED" in [f["code"] for f in o["quality_flags"]] and o["review_required"] for o in r["objects"])
          assert r["scan_label"] == "AUTOMATIC_UNREVIEWED"
          PY
          python -m photo_walk_core.validate "$LOGS"/diag/*.json
          # gevelopbouw-export (na gesimuleerde bevestiging + getekend gevelvlak): schema 1.2.0, onderhoudsoppervlak nooit afgeleid
          python -m photo_walk_core.validate "$LOGS/selftest-facade-export.json"
          python - <<'PY'
          import json, os
          r = json.load(open(os.environ["LOGS"] + "/selftest-facade-export.json"))
          assert r["contract_version"] == "1.2.0"
          for f in r["facade_composition"]["frames"]:
              q = f["quantities"]
              print(f["frame_id"], f["facade_plane_source"], {k: (v["value_m2"], v["status"]) for k, v in q.items()})
              assert q["maintainable_frame_surface"]["value_m2"] is None
              for k, v in q.items():
                  assert (v["value_m2"] is None) == (v["status"] == "UNKNOWN"), (k, v)
              if f["facade_plane_source"] == "NONE":
                  assert q["facade_gross"]["value_m2"] is None
          print("gevelopbouw-export OK")
          PY
          # audit: oude sessie (zonder gevelvelden) blijft leesbaar, wordt LEGACY en de export voldoet aan het schema
          python -m photo_walk_core.validate "$LOGS/selftest-legacy-export.json"
          python - <<'PY'
          import json, os, jsonschema
          L = os.environ["LOGS"]
          r = json.load(open(L + "/selftest-legacy-export.json"))
          st = {o["observation_id"]: o["facade_role"]["outer_contour_status"] for o in r["observations"]}
          assert st and set(st.values()) == {"LEGACY"}, st
          assert all(e["role"] != "GLASS_PANE" for f in r["facade_composition"]["frames"] for e in f["elements"]), "oude sessie kreeg ongevraagd glasvlakken"
          # audit: voorstellen uit onbevestigde automatische contouren: geen aantal, geen oppervlak, geen deelwaarde
          schema = json.load(open("../schemas/mjop_scan_proposal_v2.schema.json"))
          ps = json.load(open(L + "/selftest-round-unconfirmed.json"))
          assert ps, "geen voorstellen"
          for p in ps:
              jsonschema.Draft7Validator(schema).validate(p)
              assert p["value"] is None and p["partial_value"] is None, (p["target"], p["value"], p["partial_value"])
              assert p["booking_allowed"] is False and p["reliability"]["level"] == "INCOMPLETE"
          print("legacy-export en onbevestigde voorstellen OK:", len(ps))
          PY
          # Gevelscanner 2.0: de gevelinventaris (mjop_gevel_inventory_v1) die de app zelf maakt voldoet aan het schema, is een voorstel,
          # bevat geen prijzen en wordt niet automatisch verwerkt (pijplijn niet gevalideerd).
          grep -q "SELFTEST_GEVELSCAN facades=[1-9][0-9]* objects=[0-9][0-9]* withArea=[0-9][0-9]* autoProcessing=false" "$LOGS/selftest-console.log" || { echo "::error::selftest gaf geen geldige gevelinventaris"; exit 1; }
          python - <<'PY'
          import json, os, jsonschema
          L = os.environ["LOGS"]
          schema = json.load(open("../schemas/mjop_gevel_inventory_v1.schema.json"))
          d = json.load(open(L + "/selftest-gevel-inventory.json"))
          jsonschema.Draft7Validator(schema).validate(d)
          assert d["booking_allowed"] is False and d["confirmation"]["status"] == "PROPOSED"
          assert d["validation"]["auto_processing_allowed"] is False
          text = json.dumps(d).lower()
          assert not any(('"' + w) in text for w in ("prijs", "price", "kengetal", "kosten", "tarief")), "prijsveld in de inventaris"
          objs = [o for f in d["facades"] for o in f["objects"]]
          assert all(o["outcome"] != "BETROUWBAAR_VASTGESTELD" and o["nen2767_condition_score"] is None for o in objs)
          print("gevelinventaris: gevels", len(d["facades"]), "objecten", len(objs), "foto's", len(d["photos"]))
          PY
          # Fotoronde-voorstellen (mjop_scan_proposal_v2) uit de app voldoen aan het schema en zijn nooit boeking/bevestigd
          python - <<'PY'
          import json, os, jsonschema
          L = os.environ["LOGS"]
          schema = json.load(open("../schemas/mjop_scan_proposal_v2.schema.json"))
          docs = json.load(open(L + "/selftest-round-proposals.json"))
          assert len(docs) >= 2, docs
          for d in docs:
              jsonschema.Draft7Validator(schema).validate(d)
              assert d["booking_allowed"] is False and d["confirmation"]["status"] == "PROPOSED"
              assert d["measurement"]["uncertainty"]["validated"] is False
              if d["target"]["quantity_kind"] == "FRAME_AREA_GROSS" and d["basis"]["objects_unmeasured"] > 0:
                  assert d["value"] is None
          assert '"MEASURED"' not in json.dumps(docs), "selftest-scènes zijn elk één foto: geen MJOP-voorstel mag MEASURED zijn"
          print("fotoronde-voorstellen (Swift) voldoen aan mjop_scan_proposal_v2:", len(docs))
          PY
          # Swift-gecodeerd MJOP-scanvoorstel moet aan het schema voldoen (nullable sleutels aanwezig, geen boeking)
          python - <<'PY'
          import json, os, jsonschema
          L = os.environ["LOGS"]
          schema = json.load(open("../schemas/mjop_scan_proposal_v1.schema.json"))
          doc = json.load(open(L + "/selftest-proposal.json"))
          jsonschema.Draft7Validator(schema).validate(doc)
          assert doc["booking_allowed"] is False and doc["confirmation"]["status"] == "PROPOSED"
          print("scanvoorstel (Swift) voldoet aan mjop_scan_proposal_v1")
          PY
          python - <<'PY'
          import json, os, re
          L = os.environ["LOGS"]
          lines = {m.group(1): m.group(2) for m in re.finditer(r"SELFTEST_V2 name=(\S+) (.*)", open(L + "/selftest-console.log").read())}
          diag = {m.group(1): os.path.basename(m.group(2)) for m in re.finditer(r"SELFTEST_DIAG name=(\S+) path=(\S+)", open(L + "/selftest-console.log").read())}
          print(json.dumps(lines, indent=1))
          assert set(lines) == {"flush", "recessed_8cm", "recessed_8cm_multi_frame", "ambiguous_planes"}, lines.keys()
          def val(name, key):
              return re.search(key + r"=(\S+)", lines[name]).group(1)
          def dj(name):
              return json.load(open(L + "/diag/" + diag[name]))
          # één foto met meerdere onafhankelijke LiDAR-dieptekaders: de kaders worden gebruikt (multi-frame), maar één foto is NOOIT MEASURED
          assert val("recessed_8cm_multi_frame", "status") == "ESTIMATED" and val("recessed_8cm_multi_frame", "method") == "LIDAR_DEPTH_MULTI_FRAME"
          assert int(val("recessed_8cm_multi_frame", "independent")) >= 2
          assert "SINGLE_VIEWPOINT" in val("recessed_8cm_multi_frame", "flags")
          assert not any(val(n, "status") == "MEASURED" for n in lines), "geen enkele scène (één foto) mag MEASURED zijn"
          for n in ("flush", "recessed_8cm", "recessed_8cm_multi_frame"):
              w, h = float(val(n, "w")), float(val(n, "h"))
              assert abs(w - 1.2) < 0.012 and abs(h - 1.5) < 0.015, (n, w, h)
          # een enkel dieptekader is nooit MEASURED
          assert val("flush", "status") == "ESTIMATED" and val("recessed_8cm", "status") == "ESTIMATED"
          # terugliggend kozijn herkend uit de dieptegegevens (niet op het wandvlak gemeten)
          d = dj("recessed_8cm_multi_frame")
          assert d["algorithm"]["frame_plane"]["final_mode"] == "RECESSED" and 6 < d["algorithm"]["frame_plane"]["recess_cm"] < 10, d["algorithm"]["frame_plane"]
          assert d["measurement"]["scale_method"] == "LIDAR_DEPTH_MULTI_FRAME" and d["privacy"]["point_cloud_included"] is False
          assert all(dj(n)["measurement"]["status"] != "MEASURED" for n in diag), "diagnose-export van één foto is nooit MEASURED"
          # verspringende gevel: specifieke weigering, geen maat
          assert val("ambiguous_planes", "status") == "UNKNOWN" and "AMBIGUOUS_FACADE_PLANES" in val("ambiguous_planes", "flags")
          dd = dj("ambiguous_planes")
          assert dd["measurement"]["width_m"] is None and any(f["code"] == "AMBIGUOUS_FACADE_PLANES" for f in dd["result_flags"])
          # Diagnose 1.1.0 (door Swift geschreven): extra blok aanwezig, camera-relatief, geen verboden sleutels
          for n in diag:
              e = dj(n)
              assert e["contract_version"] == "1.1.0", (n, e["contract_version"])
              x = e["extended_diagnostics"]
              for k in ("spec_version", "computed_after_result", "frames", "camera_gravity", "quad_from_corners", "gate_constants"):
                  assert k in x, (n, k)
              assert x["spec_version"] == "1.1.0" and x["computed_after_result"] is True
              forbidden = re.compile(r"(latitude|longitude|gps|location|compass|address|pose|image|photo|point_cloud)", re.I)
              def walk(o, path=""):
                  if isinstance(o, dict):
                      for k, v in o.items():
                          assert not forbidden.search(k), (n, path + "/" + k)
                          walk(v, path + "/" + k)
                  elif isinstance(o, list):
                      for i in o: walk(i, path)
              walk(x)
          # de verspringende gevel is in de schaduwpoorten zichtbaar als mislukte selectiepoort, zonder dat er een maat ontstaat
          gs = dj("ambiguous_planes")["extended_diagnostics"].get("gates_shadow")
          assert gs is not None, "gates_shadow ontbreekt voor ambiguous_planes"
          assert dj("ambiguous_planes")["measurement"]["width_m"] is None
          print("LiDAR-v2 selftest OK")
          PY
          # er mogen geen ruwe sensorbestanden of ontwikkelbundels in de CI-logs staan (de bundel-guard zelf staat in de selftest-stap, waar $DATA bestaat)
          if find "$LOGS" -type f \( -name "*.f32" -o -name "photo.jpg" -o -name "bundle_*" \) | grep -q .; then echo "::error::ruwe sensordata of ontwikkelbundel in de CI-logs"; exit 1; fi
          grep -c "SELFTEST_DETECT" "$LOGS/selftest-console.log" | tee "$LOGS/detect-count.txt"
          [ "$(cat "$LOGS/detect-count.txt")" -ge 1 ] || { echo "::error::geen enkele detectie in de selftest"; exit 1; }
          grep "SELFTEST_PERSIST" "$LOGS/selftest-console.log"
          grep -q "SELFTEST_PERSIST observations=[1-9][0-9]* identicalDepth=true" "$LOGS/selftest-console.log" || { echo "::error::lokale opslag/herstel niet identiek"; exit 1; }
          grep "SELFTEST_ROLE\|SELFTEST_CONFIRM\|SELFTEST_FACADE\|SELFTEST_NOTE" "$LOGS/selftest-console.log" || true
          grep -q "SELFTEST_PERSIST_FACADE identical=true" "$LOGS/selftest-console.log" || { echo "::error::gevelopbouw (rollen/glasvlakken) niet identiek na opslaan en herstellen"; exit 1; }
          grep "SELFTEST_REANALYZE\|SELFTEST_LEGACY\|SELFTEST_PERSIST_AFTER_EDIT\|SELFTEST_ROUND_UNCONFIRMED\|SELFTEST_CORNER_EDIT\|SELFTEST_DUP_COVERAGE\|SELFTEST_PICKED" "$LOGS/selftest-console.log" || true
          grep -q "SELFTEST_REANALYZE added=0 glassAdded=0" "$LOGS/selftest-console.log" || { echo "::error::opnieuw zoeken voegde dubbele kozijnen of glasvlakken toe"; exit 1; }
          grep -q "SELFTEST_LEGACY decoded=true observations=[1-9][0-9]* allLegacy=true noGate=true elements=0" "$LOGS/selftest-console.log" || { echo "::error::oude sessie niet leesbaar of niet als LEGACY behandeld"; exit 1; }
          grep -q "SELFTEST_PERSIST_AFTER_EDIT identical=true revisions=[1-9]" "$LOGS/selftest-console.log" || { echo "::error::handmatige correctie niet identiek na opslaan en herstellen"; exit 1; }
          grep -q "SELFTEST_ROUND_UNCONFIRMED proposals=[1-9][0-9]* valid=true values=null,null" "$LOGS/selftest-console.log" || { echo "::error::voorstel met waarde uit onbevestigde contouren"; exit 1; }
          # issue D: hoek verslepen bevestigt niets; "Herstel detectie" + "Toepassen" ook niet; alleen "Dit is de buitenmaat" opent de contourpoort
          python - <<'PY'
          import os, re
          log = open(os.environ["LOGS"] + "/selftest-console.log").read()
          steps = {m.group(1): dict(kv.split("=", 1) for kv in m.group(2).split()) for m in re.finditer(r"SELFTEST_CORNER_EDIT step=(\S+) (.*)", log)}
          print(steps)
          assert set(steps) == {"edit", "restore", "confirm"}, "selftest hoekcorrectie niet (volledig) uitgevoerd: %s" % steps.keys()
          for k in ("edit", "restore"):
              s = steps[k]
              assert s["contour"] == "EDITED_UNCONFIRMED", (k, s)
              assert s["measurementOk"] == "false" and s["confirmVisible"] == "true", (k, s)
              assert s["objectArea"] == "null" and s["exportArea"] == "null", ("geen maat/export uit een bewerkte, onbevestigde contour", k, s)
              assert s["count"] == "null" and s["area"] == "null" and s["objectUnconfirmed"] == "true" and s["valid"] == "true", (k, s)
          e = steps["edit"]
          assert e["gate"] == "true" and e["source"] == "MANUAL_CORRECTED" and e["exportContour"] == "EDITED_UNCONFIRMED", e
          r = steps["restore"]
          assert r["restored"] == "true" and int(r["revisions"]) >= 2, ("herstel detectie: oorspronkelijke hoeken terug, revisies bewaard", r)
          c = steps["confirm"]
          assert c["contour"] == "USER_CONFIRMED" and c["gate"] == "false" and c["exportContour"] == "USER_CONFIRMED", c
          assert c["status"] != "MEASURED", ("bevestiging opent alleen de contourpoort; één foto blijft hoogstens ESTIMATED", c)
          assert c["source"] == "MANUAL_CORRECTED" and int(c["revisions"]) >= 2, ("bewerkte hoeken en revisies blijven bewaard", c)
          print("hoekcorrectie/bevestiging OK")
          PY
          # duplicaatcontrole: nul suggesties is geen bewijs; handmatige controle alleen zolang er niets wijzigt
          python - <<'PY'
          import os, re
          log = open(os.environ["LOGS"] + "/selftest-console.log").read()
          st = {m.group(1): dict(kv.split("=", 1) for kv in m.group(2).split()) for m in re.finditer(r"SELFTEST_DUP_COVERAGE step=(\S+) (.*)", log)}
          print(st)
          assert set(st) == {"no-world", "two-worlds", "reviewed", "stale", "open-suggestion"}, st.keys()
          for k in ("no-world", "two-worlds", "reviewed", "stale"):
              assert st[k]["canReview"] == "true", (k, st[k])
          o = st["open-suggestion"]
          assert int(o["suggestions"]) >= 1 and o["canReview"] == "false", ("verklaren kan pas na beoordeling van alle suggesties", o)
          assert o["count"] == "null" and o["area"] == "null" and o["partial"] == "null" and o["complete"] == "false" and "DUPLICATES_UNRESOLVED" in o["reasons"], o
          for k in ("no-world", "two-worlds", "stale"):
              s = st[k]
              assert s["suggestions"] == "0" and s["objects"] == "2" and s["checkable"] == "1", (k, s)
              assert s["count"] == "null" and s["area"] == "null" and s["partial"] == "null" and s["level"] == "INCOMPLETE", ("geblokkeerd", k, s)
              assert s["complete"] == "false" and s["valid"] == "true" and s["unchecked"] == "1", (k, s)
          assert "DUPLICATE_CHECK_INCOMPLETE" in st["no-world"]["reasons"] and st["no-world"]["unknownWorld"] == "2", st["no-world"]
          assert "CROSS_SESSION_UNCHECKED" in st["two-worlds"]["reasons"] and st["two-worlds"]["cross"] == "true", st["two-worlds"]
          r = st["reviewed"]
          assert r["complete"] == "true" and r["manual"] == "true" and r["count"] == "2.0" and r["level"] == "CHECK_REQUIRED" and r["valid"] == "true", r
          assert "DUPLICATE_CHECK_INCOMPLETE" not in r["reasons"] and "CROSS_SESSION_UNCHECKED" not in r["reasons"], r
          assert r["area"] == "null", ("F001 heeft geen maat: oppervlak blijft onvolledig", r)
          assert st["stale"]["manual"] == "false", st["stale"]
          # hoekkiezer: herkomst
          pk = {m.group(1): dict(kv.split("=", 1) for kv in m.group(2).split()) for m in re.finditer(r"SELFTEST_PICKED name=(\S+) (.*)", log)}
          print(pk)
          assert pk["self_drawn"]["source"] == "MANUAL" and pk["self_drawn"]["contour"] == "MANUAL" and pk["self_drawn"]["detector"] == "none", pk
          u = pk["candidate_unchanged"]
          assert u["source"] == "AUTO_DETECTED_CONFIRMED" and u["contour"] == "USER_CONFIRMED" and u["originalIsCandidate"] == "true" and u["revisions"] == "0", u
          m = pk["candidate_moved"]
          assert m["source"] == "MANUAL_CORRECTED" and m["contour"] == "USER_CONFIRMED" and m["contour"] != "MANUAL", m
          assert m["originalIsCandidate"] == "true" and m["cornersKept"] == "true" and m["revisions"] == "1" and m["detector"] == "VN_RECTANGLE_CANDIDATE", m
          print("duplicaatcontrole en hoekkiezer OK")
          PY

      - name: Artifacts verzamelen (simulator-app, unsigned device-IPA)
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          SIM=$(find "$RUNNER_TEMP/dd-sim" -name PhotoWalk.app -type d 2>/dev/null | head -1)
          DEV=$(find "$RUNNER_TEMP/dd-dev" -name PhotoWalk.app -type d 2>/dev/null | head -1)
          if [ -n "$SIM" ]; then ditto -c -k --keepParent "$SIM" "$RUNNER_TEMP/out/PhotoWalk-simulator.app.zip"; fi
          if [ -n "$DEV" ]; then
            rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload" && cp -R "$DEV" "$RUNNER_TEMP/ipa/Payload/"
            (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/out/PhotoWalk-UNSIGNED-device.ipa" Payload)
            codesign -dv "$DEV" 2>&1 | tee "$LOGS/codesign-device.txt" || true
            echo "--- architecturen"; lipo -archs "$DEV/PhotoWalk" | tee "$LOGS/ipa-archs.txt"
            grep -q arm64 "$LOGS/ipa-archs.txt" || { echo "::error::devicebuild bevat geen arm64"; exit 1; }
            echo "--- IPA-inhoud"; unzip -l "$RUNNER_TEMP/out/PhotoWalk-UNSIGNED-device.ipa" | head -25 | tee "$LOGS/ipa-contents.txt"
            plutil -p "$DEV/Info.plist" | grep -E "CFBundleIdentifier|MinimumOSVersion|UIRequiredDeviceCapabilities|NSCameraUsage" | tee "$LOGS/ipa-info.txt"
            shasum -a 256 "$RUNNER_TEMP/out/PhotoWalk-UNSIGNED-device.ipa" | tee "$LOGS/ipa-sha256.txt"
          fi
          ls -la "$RUNNER_TEMP/out" || true
      # De IPA wordt alleen aangeboden als ALLE voorgaande stappen (Swift-tests, UI-tests, schema-validatie) geslaagd zijn.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: photo-walk-UNSIGNED-device-ipa
          path: ${{ runner.temp }}/out/PhotoWalk-UNSIGNED-device.ipa
          if-no-files-found: warn
          retention-days: 14
      # Faalt een test, dan wordt de IPA toch bewaard, maar onder een naam die zegt dat de tests gefaald zijn. Dit bestand is NIET volledig getest en is
      # alleen bedoeld om op een toestel te proberen terwijl de mislukte test wordt uitgezocht. De run blijft rood; er is geen test uitgezet.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: photo-walk-UNSIGNED-device-ipa-TESTS-GEFAALD
          path: ${{ runner.temp }}/out/PhotoWalk-UNSIGNED-device.ipa
          if-no-files-found: warn
          retention-days: 14
      - name: Waarschuwing in de samenvatting als een test faalde
        if: failure()
        run: |
          {
            echo "### Niet volledig getest"
            echo "Een of meer stappen zijn mislukt. De IPA staat onder de naam \`photo-walk-UNSIGNED-device-ipa-TESTS-GEFAALD\` en is NIET volledig getest."
            echo "De volledig geteste IPA (\`photo-walk-UNSIGNED-device-ipa\`) bestaat alleen als alle tests geslaagd zijn."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-walk-simulator-app
          path: ${{ runner.temp }}/out/PhotoWalk-simulator.app.zip
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-walk-ci-logs
          path: ${{ github.workspace }}/ci-logs
          if-no-files-found: warn
          retention-days: 14
