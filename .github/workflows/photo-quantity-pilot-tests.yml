# Photo-to-Quantity Pilot v1 (mjop-learning/scripts/photo_quantity_pilot.py, docs/photo_quantity_pilot_v1.md).
# Alleen testen, alleen lezen: geen AI-SDK, geen netwerk in de tests, niets committen of publiceren.
name: Photo quantity pilot tests

on:
  pull_request:
    paths:
      - "mjop-learning/scripts/photo_quantity_pilot.py"
      - "mjop-learning/scripts/run_maldenhof_photo_quantity_pilot.py"
      - "mjop-learning/config/maldenhof_photo_quantity_pilot_v1.json"
      - "mjop-learning/tests/test_photo_quantity_pilot.py"
      - "mjop-learning/requirements-photo-pilot.txt"
      - ".github/workflows/photo-quantity-pilot-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photo-quantity-pilot-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo-quantity-pilot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mjop-learning
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-afhankelijkheden (vastgepind, zonder AI-SDK's)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-photo-pilot.txt
          if python -c "import anthropic" 2>/dev/null || python -c "import openai" 2>/dev/null; then
            echo "::error::AI-SDK aanwezig op de runner; de pilot heeft geen modelroute"; exit 1
          fi
      - name: pilottests, v2-kern en bewaking van schema's en bevroren stores
        run: python -m pytest -q -p no:cacheprovider tests/test_photo_quantity_pilot.py tests/test_bruto_quantity_model_v2.py tests/test_scope_guard.py tests/test_schemas.py
      - name: Niets geschreven door de tests (werkboom ongewijzigd)
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::de tests hebben bestanden gewijzigd of aangemaakt"; git status --porcelain; exit 1
          fi
