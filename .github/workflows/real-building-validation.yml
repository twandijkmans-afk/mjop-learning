# Real Building Validation v1 — GitHub Actions network bridge.
# Egress vanuit Claude Cloud naar api.pdok.nl / api.3dbag.nl wordt geweigerd; deze workflow haalt de echte
# PDOK/BAG- en 3D BAG-antwoorden op en commit ALLEEN ruwe responses + kandidatenpakket + manifest.
# Geen building-link, legal_vve-koppeling, crosswalk of wijziging van canonical MJOP-data.
name: Real building validation

on:
  workflow_dispatch:
  # workflow_dispatch werkt pas als dit bestand op de default branch staat; tot die tijd draait de workflow
  # ook bij een push van alleen dit bestand op de ontwikkelbranch (de commit-back van GITHUB_TOKEN triggert niets).
  push:
    branches:
      - claude/test-pdok-3dbag-network-yw0rcc
    paths:
      - ".github/workflows/real-building-validation.yml"

permissions:
  contents: write

concurrency:
  group: real-building-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mjop-learning
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OUT_DIR: data/external/building_validation/real_validation_v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-afhankelijkheden
        run: python -m pip install pytest jsonschema
      - name: Tests
        run: python -m pytest tests/test_fetch_real_building_validation.py -q
      - name: Netwerktest api.pdok.nl / api.3dbag.nl
        run: |
          fail=0
          for host in api.pdok.nl api.3dbag.nl; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "https://$host/" || true)
            echo "NETWORK_TEST $host HTTP $code"
            # 404/400/405 van de site zelf is prima (verbinding komt door); 000 = geen verbinding
            if [ "$code" = "000" ] || [ -z "$code" ]; then fail=1; fi
          done
          exit $fail
      - name: Kandidatenpakket ophalen
        run: python scripts/fetch_real_building_validation.py --out "$OUT_DIR"
      - name: Manifest en hashes controleren
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, "scripts")
          import fetch_real_building_validation as f
          errs = f.manifest_errors(os.environ["OUT_DIR"])
          print("manifest errors:", errs)
          sys.exit(1 if errs else 0)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: real_validation_v1
          path: mjop-learning/${{ env.OUT_DIR }}
      - name: Committen (alleen versioned resultaten)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT_DIR"
          if git diff --cached --quiet; then echo "Geen wijzigingen."; exit 0; fi
          git commit -m "data: real building validation v1 candidate package (unreviewed, PDOK/BAG + 3D BAG)"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
