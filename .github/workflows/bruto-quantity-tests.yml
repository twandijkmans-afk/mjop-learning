# Bruto Quantity Model v2 (mjop-learning/scripts/bruto_quantity_*.py, docs/bruto_quantity_model_v2.md).
#
# Alleen testen, alleen lezen: geen AI-SDK, geen netwerk in de tests, niets committen of publiceren. De tests gebruiken
# uitsluitend synthetische fixtures. De volledige suite draait met de gepinde xpdf pdftotext 4.06; scripts/check_test_baseline.py
# onderscheidt nieuwe fouten van de gedocumenteerde xpdf-omgevingsproblemen.
name: Bruto quantity model v2 tests

on:
  pull_request:
    paths:
      - "mjop-learning/scripts/bruto_quantity_*.py"
      - "mjop-learning/schemas/bruto_*_v2.schema.json"
      - "mjop-learning/vocabularies/bruto_quantity_*_v2.json"
      - "mjop-learning/tests/test_bruto_quantity_model_v2.py"
      - ".github/workflows/bruto-quantity-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bruto-quantity-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bruto-quantity-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mjop-learning
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-afhankelijkheden (vastgepind, zonder AI-SDK's)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt
          if python -c "import anthropic" 2>/dev/null || python -c "import openai" 2>/dev/null; then
            echo "::error::AI-SDK aanwezig op de runner; Bruto Quantity Model v2 heeft geen modelroute"; exit 1
          fi
      - name: v2-tests en bewaking van schema's en bevroren stores
        run: python -m pytest -q -p no:cacheprovider tests/test_bruto_quantity_model_v2.py tests/test_scope_guard.py tests/test_schemas.py
      - name: Niets geschreven door de tests (werkboom ongewijzigd)
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::de tests hebben bestanden gewijzigd of aangemaakt"; git status --porcelain; exit 1
          fi

  full-suite-with-xpdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mjop-learning
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-afhankelijkheden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt pyyaml pyproj
      - name: xpdf pdftotext 4.06 installeren en verifiëren (vastgepinde download + checksum)
        run: |
          python scripts/xpdf_runner_setup.py --install "$RUNNER_TEMP/xpdf" \
            --out "$RUNNER_TEMP/runner_setup.json" --verify-reproduction
          echo "PDFTOTEXT=$RUNNER_TEMP/xpdf/pdftotext" >> "$GITHUB_ENV"
      - name: Volledige testsuite
        run: python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/junit.xml" || true
      - name: Nieuwe fouten versus bekende baseline - xpdf is hier beschikbaar, niets wordt getolereerd
        run: python scripts/check_test_baseline.py "$RUNNER_TEMP/junit.xml"
      - name: Werkboom ongewijzigd
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::de testsuite heeft bestanden gewijzigd of aangemaakt"; git status --porcelain; exit 1
          fi
