# Human Decision Intake & Provenance Hardening v1 (uitsluitend DRY_RUN).
#
# Draait automatisch bij elke wijziging aan de intakemodule, het besluitenregister (v1), de bewaakte registerdata en de configuratie/schema's/rapporten van de intake.
# Alleen testen en alleen lezen: geen netwerk in de tests, geen secrets, geen schrijfactie naar het register, geen registratie, geen instance-activatie, geen merge.
# Job 1 is de snelle gerichte controle (intake, register-integriteit, scope guards, negatieve scenario's, rapporten actueel).
# Job 2 draait de volledige testsuite met de gepinde xpdf pdftotext 4.06; scripts/check_test_baseline.py onderscheidt nieuwe fouten van de gedocumenteerde omgevingsproblemen.
name: Human decision intake tests

on:
  pull_request:
    paths:
      - "mjop-learning/scripts/human_decision_intake.py"
      - "mjop-learning/scripts/human_decision_intake_report.py"
      - "mjop-learning/scripts/human_instance_decision_register*.py"
      - "mjop-learning/scripts/physical_instance_approval*.py"
      - "mjop-learning/tests/test_human_decision_intake.py"
      - "mjop-learning/tests/test_human_instance_decision_register.py"
      - "mjop-learning/tests/test_scope_guard.py"
      - "mjop-learning/tests/fixtures/human_decision_intake/**"
      - "mjop-learning/data/instance_decisions/**"
      - "mjop-learning/schemas/human_decision_intake_envelope.schema.json"
      - "mjop-learning/schemas/human_instance_decision*.schema.json"
      - "mjop-learning/config/human_decision_intake_trusted_providers_v1.json"
      - "mjop-learning/config/human_decision_reviewer_authorization_v1.json"
      - "mjop-learning/reports/frames/human_decision_intake_provenance_v1*"
      - "mjop-learning/scripts/check_test_baseline.py"
      - "mjop-learning/config/known_environment_failures.json"
      - ".github/workflows/human-decision-intake-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: human-decision-intake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mjop-learning
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-afhankelijkheden (vastgepind, zonder AI-SDK's)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt pyyaml pyproj
          if python -c "import anthropic" 2>/dev/null || python -c "import openai" 2>/dev/null; then
            echo "::error::AI-SDK aanwezig op de runner; de intake heeft geen modelroute"; exit 1
          fi
      - name: Register v1 ongewijzigd (leeg, 0 bytes)
        run: test ! -s data/instance_decisions/human_instance_decision_register_v1.jsonl
      - name: Intake, register-integriteit, scope guards en approval-framework
        run: python -m pytest -q -p no:cacheprovider tests/test_human_decision_intake.py tests/test_human_instance_decision_register.py tests/test_scope_guard.py tests/test_physical_instance_approval.py
      - name: Rapporten en v2-schema actueel
        run: python scripts/human_decision_intake.py generate --check
      - name: Niets geschreven door de tests (werkboom ongewijzigd)
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::de tests hebben bestanden gewijzigd of aangemaakt"; git status --porcelain; exit 1
          fi

  full-suite-with-xpdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mjop-learning
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python-afhankelijkheden
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt pyyaml pyproj
      - name: xpdf pdftotext 4.06 installeren en verifiëren (vastgepinde download + checksum)
        run: |
          python scripts/xpdf_runner_setup.py --install "$RUNNER_TEMP/xpdf" \
            --out "$RUNNER_TEMP/runner_setup.json" --verify-reproduction
          echo "PDFTOTEXT=$RUNNER_TEMP/xpdf/pdftotext" >> "$GITHUB_ENV"
      - name: Volledige testsuite
        run: python -m pytest -q -p no:cacheprovider --junitxml="$RUNNER_TEMP/junit.xml" || true
      - name: Nieuwe fouten versus bekende baseline - xpdf is hier beschikbaar, niets wordt getolereerd
        run: python scripts/check_test_baseline.py "$RUNNER_TEMP/junit.xml"
      - name: Werkboom ongewijzigd
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::de testsuite heeft bestanden gewijzigd of aangemaakt"; git status --porcelain; exit 1
          fi
