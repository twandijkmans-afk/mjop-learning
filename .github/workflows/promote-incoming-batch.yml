# Incoming batch promotion v1 (mjop-learning/docs/incoming_pipeline_v1.md)
#
# Twee manieren om te starten:
#   1. Actions -> "Promote incoming MJOP batch" -> Run workflow (zodra deze workflow op main staat)
#   2. Een bestand mjop-learning/data/incoming_batches/<batch_id>/promotion_request.json committen:
#        {"action": "dry-run" | "approve-and-promote" | "rollback",
#         "reviewer": "twandijkmans", "include_review": ["DOC-012"]}
# Geen AI, geen xpdf nodig (alles is gestaged). Canonieke data wijzigt alleen bij approve-and-promote
# of rollback, na volledige preflight; bij een fout wordt alles automatisch teruggezet.
name: Promote incoming MJOP batch

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: "Batch-id (bijv. IB-a954492fd0ea)"
        required: true
      action:
        description: "dry-run, approve-and-promote of rollback"
        type: choice
        options: [dry-run, approve-and-promote, rollback]
        default: dry-run
      reviewer:
        description: "Naam van de beoordelaar (verplicht bij approve-and-promote)"
        required: false
        default: ""
      include_review:
        description: "Optioneel: REVIEW_REQUIRED-documenten die je expliciet goedkeurt (spatie-gescheiden DOC-ID's)"
        required: false
        default: ""
  push:
    paths:
      - "mjop-learning/data/incoming_batches/*/promotion_request.json"

permissions:
  contents: write

concurrency:
  group: canonical-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mjop-learning
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Python-afhankelijkheden (vastgepind, zonder AI-SDK's)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pipeline.txt

      - name: Opdracht bepalen
        id: req
        env:
          IN_BATCH: ${{ github.event.inputs.batch_id }}
          IN_ACTION: ${{ github.event.inputs.action }}
          IN_REVIEWER: ${{ github.event.inputs.reviewer }}
          IN_INCLUDE: ${{ github.event.inputs.include_review }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, subprocess
          if os.environ.get("IN_BATCH"):
              batch, action = os.environ["IN_BATCH"], os.environ["IN_ACTION"]
              reviewer, include = os.environ.get("IN_REVIEWER", ""), os.environ.get("IN_INCLUDE", "").split()
          else:
              changed = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True,
                                       text=True).stdout.split()
              req = [p for p in changed if p.endswith("/promotion_request.json")]
              assert len(req) == 1, f"precies één promotion_request.json per commit verwacht: {req}"
              batch = req[0].split("/")[-2]
              r = json.load(open(os.path.relpath(os.path.join("..", req[0]))))
              action, reviewer, include = r["action"], r.get("reviewer", ""), r.get("include_review", [])
          ok = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")
          assert ok.match(batch) and action in ("dry-run", "approve-and-promote", "rollback"), (batch, action)
          assert all(re.match(r"^DOC-\d{3,}$", d) for d in include), include
          assert re.match(r"^[A-Za-z0-9 ._-]*$", reviewer), reviewer
          print(f"batch={batch}"); print(f"action={action}"); print(f"reviewer={reviewer}")
          print(f"include={' '.join(include)}")
          PY

      - name: Tests (incoming + promotie)
        run: python -m pytest -q tests/test_incoming_pipeline.py tests/test_incoming_promotion.py

      - name: Controle vooraf
        run: python scripts/promote_incoming_batch.py --check

      - name: Dry-run (altijd; reviewrapport)
        run: python scripts/promote_incoming_batch.py --dry-run --batch-id "${{ steps.req.outputs.batch }}"

      - name: Goedkeuren en promoveren
        if: steps.req.outputs.action == 'approve-and-promote'
        run: |
          test -n "${{ steps.req.outputs.reviewer }}" || { echo "::error::reviewer verplicht"; exit 1; }
          INCLUDE="${{ steps.req.outputs.include }}"
          python scripts/promote_incoming_batch.py --approve --batch-id "${{ steps.req.outputs.batch }}" \
            --reviewer "${{ steps.req.outputs.reviewer }}" ${INCLUDE:+--include-review $INCLUDE}
          python scripts/promote_incoming_batch.py --promote --batch-id "${{ steps.req.outputs.batch }}"

      - name: Rollback
        if: steps.req.outputs.action == 'rollback'
        run: python scripts/promote_incoming_batch.py --rollback --batch-id "${{ steps.req.outputs.batch }}"

      - name: Controle achteraf
        run: |
          python scripts/promote_incoming_batch.py --check
          python scripts/promote_canonical_batch1.py --verify
          python scripts/process_incoming_batch.py --check

      - name: Volledige testsuite na wijziging
        if: steps.req.outputs.action != 'dry-run'
        run: python -m pytest -q

      - name: Resultaat committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data reports
          if git diff --cached --quiet; then echo "Niets te committen."; exit 0; fi
          git commit -m "chore: incoming batch ${{ steps.req.outputs.batch }} ${{ steps.req.outputs.action }}"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
